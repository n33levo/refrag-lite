name: refrag-lite
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python>=3.10
  - pip>=23.0

  # PyTorch for Mac with MPS support
  - pytorch>=2.3.0

  # Scientific computing
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scipy>=1.11.0
  - scikit-learn>=1.4.0

  # Visualization
  - matplotlib>=3.8.0
  - seaborn>=0.13.0

  # Utilities
  - pyyaml>=6.0
  - tqdm>=4.66.0
