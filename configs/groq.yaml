# Groq-first config with local training compatibility

# Environment
environment: "groq"
device: "auto"
output_dir: "outputs/groq"
checkpoint_dir: "checkpoints/groq"
log_dir: "logs/groq"

# LLM used for any local training/fallback inference
llm:
  model_name: "meta-llama/Llama-3.1-8B-Instruct"
  torch_dtype: "bfloat16"
  max_length: 2048
  use_peft: true
  peft_config:
    task_type: "CAUSAL_LM"
    r: 16
    lora_alpha: 32
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
    lora_dropout: 0.1
    bias: "none"

# Data
data:
  name: "hotpotqa"
  path: "data/hotpotqa"
  train_samples: 1000
  eval_samples: 200
  test_samples: 200
  max_length: 2048
  num_workers: 0  # Use 0 on macOS to avoid spawn-related re-import warnings

# Retrieval (needed for policy features and optional index usage)
retrieval:
  top_k: 10
  bm25_weight: 0.5
  dense_weight: 0.5
  use_reranker: true
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  chunk_size: 512
  chunk_overlap: 64

# Encoder (teacher for compression)
encoder:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  max_length: 512
  device: "mps"
  normalize: true

# Projector (maps encoder vectors -> LLM hidden size)
projector:
  hidden_dims: [512, 1024, 4096]
  activation: "gelu"
  dropout: 0.1
  layer_norm: true

# Training – Stage 1: Reconstruction
pretrain_recon:
  num_epochs: 1
  batch_size: 4
  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  gradient_accumulation_steps: 2

# Training – Stage 2: Continual Pretraining with mixed contexts
pretrain_cpt:
  num_epochs: 1
  batch_size: 2
  learning_rate: 5.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  gradient_accumulation_steps: 2
  curriculum:
    enabled: true
    start_chunks: 1
    end_chunks: 5
    steps: 500
  projector_weight: 0.2

# Training – Stage 3: SFT on QA
sft:
  num_epochs: 1
  batch_size: 1
  learning_rate: 2.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  gradient_accumulation_steps: 4
  num_compressed: 7
  num_expanded: 3
  projector_weight: 0.15
  compressed_reg_weight: 0.01

# RL settings
rl:
  algorithm: "linucb"
  top_k_candidates: 8
  token_budget: 1500
  compression_rate: 0.7
  bandit:
    alpha: 0.5
    lambda_: 1.0
    update_freq: 10
    num_rollouts: 200
  reward:
    perplexity_weight: -0.5
    token_penalty: 0.0005
    correctness_bonus: 2.0

# Evaluation
eval:
  batch_size: 4
  num_samples: 100
  output_dir: "outputs/groq"
  metrics: ["em", "f1", "evidence_precision", "evidence_recall"]

# Groq API (used if GROQ_API_KEY is available)
groq:
  api_key: "${GROQ_API_KEY}"
  model: "llama-3.1-8b-instant"
  base_url: "https://api.groq.com/openai/v1"
  max_tokens: 256
  temperature: 0.7
  timeout: 15

# Speed evaluation (optional)
speed:
  num_samples: 50
  warmup_samples: 5
  output_dir: "outputs/groq"
