# Groq API Configuration
# Optimized for Groq API usage (no local LLM inference)

# Environment
environment: "groq"
device: "cuda"  # Use GPU on Lambda Labs
output_dir: "outputs/groq"
checkpoint_dir: "checkpoints/groq"
log_dir: "logs/groq"

# LLM Configuration (for local training components)
llm:
  model_name: "meta-llama/Llama-3.1-8B-Instruct"
  torch_dtype: "float16"  # Use float16 for GPU efficiency
  max_context_length: 2048
  use_peft: true
  peft_config:
    task_type: "CAUSAL_LM"
    r: 16
    lora_alpha: 32
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
    lora_dropout: 0.1
    bias: "none"

# Data
data:
  name: "hotpotqa"
  path: "data/hotpotqa"
  train_samples: 1000  # Smaller for faster testing
  eval_samples: 100
  test_samples: 100
  max_length: 2048
  num_workers: 4
  max_context_length: 4096

# Encoder settings (still local)
encoder:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  max_length: 512
  device: "cuda"  # Use GPU for encoder too

# Projector settings (still local)
projector:
  input_dim: 384  # MiniLM dimension
  hidden_dim: 512
  output_dim: 4096  # Llama-3.1-8B embedding dimension
  num_layers: 2
  dropout: 0.1

# Training settings (optimized for Groq)
pretrain_recon:
  num_epochs: 3
  batch_size: 8
  learning_rate: 1e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_steps: 50
  save_steps: 100

pretrain_cpt:
  num_epochs: 2
  batch_size: 4
  learning_rate: 5e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_steps: 100
  curriculum_steps: 500

sft:
  num_epochs: 2
  batch_size: 2
  learning_rate: 2e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_steps: 50

# RL settings (optimized for Groq)
rl:
  algorithm: "linucb"
  num_rollouts: 600
  top_k_candidates: 12
  token_budget: 2000
  compression_rate: 0.6
  
  bandit:
    alpha: 0.1
    lambda_: 0.01
    update_freq: 5
  
  reward:
    token_penalty: 0.0015
    correctness_bonus: 1.8

# Evaluation settings
eval:
  batch_size: 4
  num_samples: 100
  output_dir: "outputs/groq"
  metrics: ["em", "f1", "evidence_precision", "evidence_recall"]
  plot_formats: ["png", "pdf"]
  speed_metrics: ["ttft", "throughput", "vram"]

# Groq API settings
groq:
  api_key: "${GROQ_API_KEY}"  # Set via environment variable
  model: "llama-3.1-8b-instant"  # Fast Groq model
  base_url: "https://api.groq.com/openai/v1"
  max_tokens: 256  # Shorter responses for faster processing
  temperature: 0.7
  timeout: 15  # Shorter timeout for faster failures

# Speed settings (optimized for Groq)
speed:
  num_samples: 50
  warmup_samples: 5
  output_dir: "outputs/groq"
