# Tiny configuration for quick testing (~30 min on CPU/small GPU)
# Uses small models and reduced dataset sizes

# General settings
seed: 42
device: "auto"  # auto, cuda, cpu
output_dir: "outputs/tiny"
checkpoint_dir: "checkpoints/tiny"
log_dir: "logs/tiny"

# Data
data:
  name: "hotpotqa"
  path: "data/hotpotqa"
  train_samples: 500  # Tiny subset
  eval_samples: 100
  test_samples: 100
  max_length: 512
  num_workers: 2
  max_context_length: 2048

# LLM settings
llm:
  model_name: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
  torch_dtype: "float32"  # CPU-friendly
  use_flash_attention: false
  max_length: 512
  use_peft: true
  peft_config:
    lora_r: 8
    lora_alpha: 16
    lora_dropout: 0.05
    target_modules: ["q_proj", "v_proj"]
    task_type: "CAUSAL_LM"

# Encoder settings
encoder:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  pooling: "mean"
  normalize: true
  max_length: 128

# Projector settings
projector:
  hidden_dims: [384, 512]  # MiniLM dim=384 -> TinyLlama dim=2048
  activation: "gelu"
  dropout: 0.1
  layer_norm: true

# Retrieval settings
retrieval:
  top_k: 5  # Reduced for tiny
  bm25_weight: 0.5
  dense_weight: 0.5
  use_reranker: false
  chunk_size: 256
  chunk_overlap: 32

# Training - Stage 1: Reconstruction
pretrain_recon:
  batch_size: 4
  learning_rate: 3.0e-4
  num_epochs: 2
  warmup_steps: 50
  weight_decay: 0.01
  gradient_accumulation_steps: 2
  max_grad_norm: 1.0
  mask_ratio: 0.3

# Training - Stage 2: Continual Pretraining
pretrain_cpt:
  batch_size: 4
  learning_rate: 2.0e-4
  num_epochs: 2
  warmup_steps: 50
  weight_decay: 0.01
  gradient_accumulation_steps: 2
  max_grad_norm: 1.0
  curriculum:
    enabled: true
    start_chunks: 1
    end_chunks: 3
    steps: 200

# Training - Stage 3: SFT
sft:
  batch_size: 2
  learning_rate: 1.0e-4
  num_epochs: 2
  warmup_steps: 50
  weight_decay: 0.01
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  num_compressed: 3  # Fixed: compress 3 chunks
  num_expanded: 2    # Fixed: expand 2 chunks

# RL settings
rl:
  algorithm: "linucb"  # linucb, thompson, ppo
  token_budget: 1000
  compression_rate: 0.6  # Compress 60% of chunks
  top_k_candidates: 5

  # Reward function
  reward:
    perplexity_weight: -1.0
    token_penalty: 0.001
    correctness_bonus: 0.5

  # Bandit parameters
  bandit:
    alpha: 0.5  # LinUCB exploration
    lambda_: 1.0  # Regularization
    num_rollouts: 200  # Tiny training set
    update_freq: 20

  # Thompson Sampling parameters
  thompson:
    prior_mean: 0.0
    prior_variance: 1.0
    noise_variance: 0.1
    num_rollouts: 200

  # PPO parameters (optional)
  ppo:
    learning_rate: 3.0e-4
    num_epochs: 5
    batch_size: 8
    gamma: 0.99
    gae_lambda: 0.95
    clip_epsilon: 0.2
    value_coef: 0.5
    entropy_coef: 0.01
    max_grad_norm: 0.5
    num_rollouts: 500

# Evaluation
eval:
  batch_size: 4
  num_samples: 100
  output_dir: "outputs/tiny"
  metrics: ["em", "f1", "evidence_precision", "evidence_recall"]
  speed_metrics: ["ttft", "throughput", "vram"]
  save_predictions: true
  plot_formats: ["png", "pdf"]

# Logging
logging:
  use_mlflow: false  # Disable for tiny runs
  use_tensorboard: true
  log_interval: 10
  eval_interval: 100
  save_interval: 100
  verbose: true
